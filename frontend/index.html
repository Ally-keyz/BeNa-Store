<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ff7034" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bena.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          /* Storage can be unavailable; the app falls back to system mode. */
        }
      })();
    </script>
    <title>BeNa Origins — Rwandan coffee, food & crafts</title>
    <meta
      name="description"
      content="Rwandan coffee, pantry staples and handwoven crafts, sourced with care and delivered across Europe."
    />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/mona-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
