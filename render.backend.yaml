# Reference copy of the backend service configuration.
#
# The live backend already exists at https://bena-origins.onrender.com and is
# managed in the Render dashboard. This file is NOT used by the frontend
# Blueprint (render.yaml) — keeping it here preserves the environment settings
# for future backend redeploys. Do not commit secrets; sync: false values are
# entered in the dashboard.
services:
  - type: web
    name: bena-origins
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: "false"
      - key: TRUST_PROXY
        value: "1"

      - key: SITE_URL
        value: https://benaorigins.de
      - key: SITE_NAME
        value: BeNa Origins
      - key: FRONTEND_URL
        value: https://benaorigins.de
      - key: CORS_ALLOWED_ORIGINS
        value: https://benaorigins.de,https://www.benaorigins.de,https://bena-origins.onrender.com,https://bena-origins-frontend.onrender.com
      - key: SOCKET_CORS_ORIGINS
        value: https://benaorigins.de,https://www.benaorigins.de,https://bena-origins.onrender.com,https://bena-origins-frontend.onrender.com
      - key: API_PUBLIC_URL
        value: https://bena-origins.onrender.com

      # Keep live mode explicit. A Storefront token is strongly recommended;
      # tokenless live access still serves products/collections/cart.
      - key: SHOPIFY_MOCK_MODE
        value: "false"
      - key: SHOPIFY_STORE_DOMAIN
        value: benaafricanshop.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: 2026-10
      - key: SHOPIFY_STOREFRONT_PRIVATE_TOKEN
        sync: false
      - key: SHOPIFY_STOREFRONT_PUBLIC_TOKEN
        sync: false

      # Webhooks: set these after the first deploy, then register subscriptions.
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_WEBHOOK_BASE_URL
        value: https://bena-origins.onrender.com

      # Layer 2 admin auth.
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY_SHA256
        sync: false

      # Customer Account API.
      - key: AUTH_CUSTOMER_ACCOUNTS_ENABLED
        value: "true"
      - key: AUTH_SESSION_TTL_SECONDS
        value: "86400"
      - key: AUTH_STATE_TTL_SECONDS
        value: "600"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"

      - key: SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID
        value: 6a04fd8a-dab4-4038-871b-127fe73e3845
      - key: SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_CUSTOMER_ACCOUNT_SCOPE
        value: openid email customer-account-api:full
      - key: SHOPIFY_CUSTOMER_ACCOUNT_AUTH_URL
        value: https://shopify.com/authentication/96630014285/oauth/authorize
      - key: SHOPIFY_CUSTOMER_ACCOUNT_TOKEN_URL
        value: https://shopify.com/authentication/96630014285/oauth/token
      - key: SHOPIFY_CUSTOMER_ACCOUNT_LOGOUT_URL
        value: https://shopify.com/authentication/96630014285/logout
      - key: SHOPIFY_CUSTOMER_ACCOUNT_JWKS_URI
        value: https://shopify.com/authentication/96630014285/.well-known/jwks.json
      - key: SHOPIFY_CUSTOMER_ACCOUNT_ISSUER
        value: https://shopify.com/authentication/96630014285
      - key: SHOPIFY_CUSTOMER_ACCOUNT_API_URL
        value: https://shopify.com/96630014285/account/customer/api/2026-10/graphql
      - key: SHOPIFY_CUSTOMER_ACCOUNT_REDIRECT_URI
        value: https://bena-origins.onrender.com/api/v1/auth/callback
      - key: SHOPIFY_CUSTOMER_ACCOUNT_LOGOUT_REDIRECT_URI
        value: https://benaorigins.de/account/logged-out
      - key: SHOPIFY_CUSTOMER_ACCOUNT_JS_ORIGIN
        value: https://bena-origins.onrender.com

      # AI product-fact suggestions: paste a free Groq API key in the dashboard.
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-20b

      # Optional integrations (app defaults are safe).
      - key: NEWSLETTER_PROVIDER
        value: mock
      - key: REVIEWS_PROVIDER
        value: auto
      - key: REVIEWS_RATE_LIMIT_MAX
        value: "5"
      - key: REVIEWS_NOTIFICATION_EMAIL
        value: store@benaorigins.de
      # Restock alerts send real email via Resend. RESTOCK_FROM_EMAIL must be a
      # verified sender/domain in Resend. Signups are memory-only (no Redis).
      - key: RESTOCK_PROVIDER
        value: resend
      - key: RESTOCK_RESEND_API_KEY
        sync: false
      - key: RESTOCK_FROM_EMAIL
        sync: false
      - key: RESTOCK_SIGNUP_TTL_SECONDS
        value: "2592000"
